<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <style>
        :root {
            --bg: #0a0a0f;
            --surface: #14141f;
            --surface2: #1c1c2e;
            --accent: #c41e3a;
            --text: #e8e8f0;
            --muted: #8888a0;
            --border: #2a2a3e;
        }
        * { margin:0; padding:0; box-sizing:border-box; }
        body {
            width:340px;
            font-family:'Segoe UI',system-ui,sans-serif;
            background:var(--bg);
            color:var(--text);
        }
        .header {
            padding:14px 16px;
            background:var(--surface);
            border-bottom:1px solid var(--border);
            display:flex;
            justify-content:space-between;
            align-items:center;
        }
        .header h1.brand {
            margin:0; padding:0; line-height:0;
            display:flex; align-items:center;
            background:none; -webkit-text-fill-color:initial;
        }
        .header h1.brand img {
            /* Lockup is ~4.8:1, so 30px here is ~143px wide — sized to sit
               beside the version pill inside a 340px popup without crowding it.
               The solid letterforms stay legible at this height. */
            height:30px; width:auto; display:block;
        }
        .header h1 {
            font-size:15px;
            font-weight:700;
            background:linear-gradient(135deg, var(--accent), #ff6b6b);
            -webkit-background-clip:text;
            -webkit-text-fill-color:transparent;
        }
        .header .ver {
            font-size:9px;
            color:var(--muted);
            background:var(--surface2);
            padding:2px 6px;
            border-radius:8px;
            border:1px solid var(--border);
        }
        .stats {
            display:grid;
            grid-template-columns:1fr 1fr 1fr;
            gap:8px;
            padding:12px 16px;
            border-bottom:1px solid var(--border);
        }
        .stat {
            text-align:center;
            background:var(--surface);
            padding:10px 8px;
            border-radius:8px;
            border:1px solid var(--border);
        }
        .stat .val {
            font-size:18px;
            font-weight:700;
            margin-bottom:2px;
        }
        .stat .lbl {
            font-size:8px;
            color:var(--muted);
            text-transform:uppercase;
            letter-spacing:0.5px;
            font-weight:600;
        }
        .recent-list {
            max-height:280px;
            overflow-y:auto;
        }
        .recent-list::-webkit-scrollbar { width:3px; }
        .recent-list::-webkit-scrollbar-thumb { background:var(--border); border-radius:2px; }
        .item {
            padding:10px 16px;
            border-bottom:1px solid var(--border);
            transition:background 0.2s;
        }
        .item:hover { background:var(--surface); }
        .item-meta {
            display:flex;
            justify-content:space-between;
            align-items:center;
            margin-bottom:4px;
            font-size:10px;
            color:var(--muted);
        }
        .item-meta .tag {
            font-size:8px;
            font-weight:700;
            padding:2px 6px;
            border-radius:3px;
            text-transform:uppercase;
        }
        .item-meta .tag.prompt { color:#ff6b6b; border:1px solid rgba(255,107,107,0.3); }
        .item-meta .tag.response { color:#4ade80; border:1px solid rgba(74,222,128,0.3); }
        .item-content {
            font-size:11px;
            color:var(--text);
            line-height:1.4;
            overflow:hidden;
            text-overflow:ellipsis;
            display:-webkit-box;
            -webkit-line-clamp:2;
            -webkit-box-orient:vertical;
        }
        .item-tags {
            margin-top:4px;
        }
        .item-tags .pill {
            font-size:8px;
            padding:1px 5px;
            border-radius:6px;
            background:var(--surface2);
            color:var(--muted);
            border:1px solid var(--border);
            display:inline-block;
            margin-right:3px;
        }
        .footer {
            padding:12px 16px;
            display:flex;
            gap:8px;
            border-top:1px solid var(--border);
        }
        .footer button {
            flex:1;
            padding:8px;
            border:1px solid var(--border);
            border-radius:6px;
            cursor:pointer;
            font-size:11px;
            font-weight:600;
            font-family:inherit;
            transition:all 0.2s;
        }
        .footer .btn-dash {
            background:var(--accent);
            color:white;
            border-color:var(--accent);
        }
        .footer .btn-dash:hover { background:#a01830; }
        .footer .btn-all {
            background:var(--surface);
            color:var(--text);
        }
        .footer .btn-all:hover { background:var(--surface2); }
        .footer .btn-sync {
            background:var(--surface);
            color:#4ade80;
            border-color:rgba(74,222,128,0.3);
        }
        .footer .btn-sync:hover { background:rgba(74,222,128,0.1); }
    </style>
</head>
<body>
    <div class="header">
        <h1 class="brand"><img src="logo.png" alt="Promptrix"></h1>
        <span class="ver">v2.0</span>
    </div>

    <div class="stats">
        <div class="stat">
            <div class="val" id="count-total">0</div>
            <div class="lbl">Captures</div>
        </div>
        <div class="stat">
            <div class="val" id="count-tokens">0</div>
            <div class="lbl">Tokens</div>
        </div>
        <div class="stat">
            <div class="val" id="count-starred">0</div>
            <div class="lbl">⭐ Starred</div>
        </div>
    </div>

    <div class="recent-list" id="recent-list">
        <!-- recent items -->
    </div>

    <div class="footer">
        <button class="btn-dash" id="open-dash">Dashboard</button>
        <button class="btn-sync" id="sync-cloud">☁ Sync</button>
        <button class="btn-all" id="view-all">View All</button>
    </div>

    <script src="popup.js"></script>
</body>
</html>
